            Descrizione dello stato del delivery cartaceo che viene notificato.
        statusDateTime:
          type: string
          format: date-time
          description: >-
            Data stato con timezone
        deliveryFailureCause: 
          description: >-
            _Motivazione di irreperibilità_ obbligtorie nei relativi eventi <br/>
            - __M01__ destinatario irreperibile <br/>
            - __M03__ destinatario sconosciuto <br/>
            - __M04__ destinatario trasferito <br/>
            _Motivazione di mancata consegna_ obbligtorie nei relativi eventi <br/>
            - __M02__ destinatario deceduto <br/>
            - __M05__ invio rifiutato <br/>
            - __M06__ indirizzo inesatto <br/>
            - __M07__ indirizzo inesistente <br/>
            - __M08__ indirizzo insufficiente <br/>
            - __M09__ altre Motivazioni <br/>
            _Motivazione di furto o smarrimento_ obbligtorie nei relativi eventi <br/>
            - __F01__ in caso di furto  <br/>
            - __F02__ in caso di smarrimento  <br/>
            - __F03__ in caso di deterioramento  <br/>
            - __F04__ in caso di rapina  <br/>
            _Motivazione di causa di forza maggiore_ obbligtorie nei relativi eventi <br/>
            - __C01__ incendio <br/>
            - __C02__ strada chiusa per lavori in corso o frana <br/>
            - __C03__ strada chiusa dalle autorità per eventi eccezionali <br/>
            - __C04__ maltempo: alluvione, neve o allagamento <br/>
            - __C05__ terremoto <br/>
            - __C06__ eruzione vulcanica <br/>
          type: string
          minLength: 2
          maxLength: 10
        attachments:
          description: >-
            elenco dei documenti prodotti che attestano quanto accaduto durante il processo 
            di postalizzazione
          type: array
          minItems: 0
          maxItems: 10
          items:
            type: object
            required: 
              - id
              - documentType
              - uri
              - sha256
              - date
            properties:
              id: 
                type: string
                description: >-
                  Identificativo di riga.
                minLength: 1 
                maxLength: 10
              documentId:
                type: string
                description: >-
                  Codice postale dell'oggetto di ritorno
              documentType:
                type: string
                minLength: 2
                maxLength: 10
                description: >-
                  _La descrizione della tipologia di oggetto._
                  - __23L__ <br/>
                  - __ARCAD__ <br/>
                  - __CAD__ <br/>
                  - __CAN__ <br/>
                  - __Plico__ <br/>
                  - __Indagine__ <br/>
                  - __AR__ <br/>
              uri:
                type: string
                minLength: 5
                maxLength: 2000
                description: >-
                  Le coordinate del documento correlato allo stato. 
              sha256:
                type: string 
                minLength: 40
                maxLength: 50
                description: >-
                  sha256, codificato in base 64, del contenuto del file riferenziato dal campo uri
              date:
                type: string
                format: date-time
                description: >-
                  Data di produzione del documento.
              sourceType:
                type: string
                description: >-
                  [NUOVASPECIFICA] Indica se il documento è stato prodotto tramite scansione cartacea (`SCANNED`) oppure generato digitalmente (`DIGITAL`). 
                  - __SCANNED__ <br/>
                  - __DIGITAL__ <br/>
                  In caso di assenza del campo, la piattaforma considererà DIGITAL gli allegati con MIME/Type application/zip.
              originType:
                type: string
                description: >-
                  [NUOVASPECIFICA] Specifica l'origine del documento
