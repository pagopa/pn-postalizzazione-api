            - __RECAG002B__		- [890] - Consegnato a persona abilitata - In Dematerializzazione <br/> 
            - __RECAG002C__		- [890] - Consegnato a persona abilitata - Fascicolo Chiuso <br/> 
            - __RECAG003A__		- [890] - Mancata consegna - pre-esito <br/> 
