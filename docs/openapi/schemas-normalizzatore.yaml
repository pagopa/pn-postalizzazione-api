components: 

  parameters:
  
    xPagopaAddrManCxId:
        name: "pn-address-manager-cx-id"
        in: header
        schema:
          type: string
        required: true
    xPagopaAddrManApiKey:
        name: x-api-key
        description: Credenziale di accesso
        in: header
        required: true
        schema:
          type: string

  schemas:

    NormalizzazioneRequest:
      type: object
      required:
        - requestId
        - sha256
        - uri
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 250
          description: id lavorazione
        uri:
          type: string
          minLength: 5
          maxLength: 2000
          description: Le coordinate del documento correlato allo stato.
        sha256:
          type: string
          minLength: 40
          maxLength: 50
          description: sha256, codificato in base 64, del contenuto del file riferenziato dal campo uri
        idConf:
          type: string
          description: Eventuale configurazione speciale per la normalizzazione

    NormalizzazioneResponse:
      type: object
      required:
        - requestId
      description: >-
        error valorizzato solo in caso di mancata accettazione
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 250
          description: id lavorazione
        error:
          type: string
          description: >-
            identificativo dell'errore            
              - NOR400: BAD REQUEST. Mi passa un input errato sia dal punto di vista del contenuto o formale;
              - NOR401: UNAUTHORIZATED. Mi passa delle credenziali vuote o errate;
              - NOR404: NOT FOUND. Il servizio nel server Postel non è disponibile;
              - NOR500: INTERNAL_SERVER_ERROR. Il servizio nei server Postel non è raggiungibile;
              - NOR998: SERVIZIO DI NORMALIZZAZIONE NON DISPONIBILE; 
    
    DeduplicaRequest:
      type: object
      required:
        - masterIn
        - slaveIn
      properties:
        configIn:
          $ref: '#/components/schemas/ConfigIn'
        masterIn:
          description: Indirizzo base con cui deduplicare lo slave
          $ref: '#/components/schemas/AddressIn'
        slaveIn:
          description: Indirizzo oggetto della deduplica
          $ref: '#/components/schemas/AddressIn'

    ConfigIn:
      type: object
      properties:
        configurazioneDeduplica:
          type: string
        configurazioneNorm:
          type: string

    AddressIn:
      type: object
      required:
       - localita
       - indirizzo
      properties:
        id:
          type: string
        provincia:
          type: string
        cap:
          type: string
        localita:
          type: string
        localitaAggiuntiva:
          type: string
        indirizzo:
          type: string
        indirizzoAggiuntivo:
          type: string
        stato:
          type: string

    DeduplicaResponse:
      type: object
      description: >-
        slaveOut e risultatoDedu: obbligatori in caso di risposta di successo
        errore: valorizzato in caso di risposta con errore
      properties:
        masterOut:
          description: risultato delle deduplica 
          $ref: '#/components/schemas/AddressOut'
        slaveOut:
          description: risultato delle deduplica
          $ref: '#/components/schemas/AddressOut'
        risultatoDedu:
          type: boolean
          description: >-
            Codice contenete l'esito del processo di deduplica
            - false: Indirzzi differenti
            - true: Indirizzi uguali
        errore:
          type: string
          description: >-
            identificativo dell'errore
            - DED400: BAD REQUEST. Mi passa un input errato sia dal punto di vista del contenuto o formale;
            - DED401: UNAUTHORIZATED. Mi passa delle credenziali vuote o errate;
            - DED404: NOT FOUND. Il servizio nel server Postel non è disponibile;
            - DED500: INTERNAL_SERVER_ERROR. Il servizio nei server Postel non è raggiungibile; 
            - DED998: SERVIZIO DI NORMALIZZAZIONE NON DISPONIBILE; 
            - DED997: SERVIZIO ORACLE NON DISPONIBILE; 
            - DED992: ERRORE_GENERICO;
            - DED001: WARNING - DEDUPLICA NON POSSIBILE PER INDIRIZZO_MASTER_SCARTATO
            - DED002: WARNING - DEDUPLICA NON POSSIBILE PER INDIRIZZO_SLAVE_SCARTATO;
            - DED003: WARNING - DEDUPLICA NON POSSIBILE PER ENTRAMBI_SCARTATI;

    AddressOut:
      type: object
      required:
       - nRisultatoNorm
       - fPostalizzabile
      properties:
        id:
          type: string
        nRisultatoNorm:
          type: integer
        nErroreNorm:
          type: integer
        sSiglaProv:
          type: string
        fPostalizzabile:
          type: string
        sStatoUff:
          type: string
        sStatoAbb:
          type: string
        sStatoSpedizione:
          type: string
        sComuneUff:
          type: string
        sComuneAbb:
          type: string
        sComuneSpedizione:
          type: string
        sFrazioneUff:
          type: string
        sFrazioneAbb:
          type: string
        sFrazioneSpedizione:
          type: string
        sCivicoAltro:
          type: string
        sCap:
          type: string
        sPresso:
          type: string
        sViaCompletaUff:
          type: string
        sViaCompletaAbb:
          type: string
        sViaCompletaSpedizione:
          type: string

    NormalizerCallbackRequest:
      type: object
      description: >-
        uri e sha256 obbligatori in caso di callback di successo
        error obbligatorio in caso di callback di errore
      required:
        - requestId
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 250
          description: id lavorazione
        uri:
          type: string
          minLength: 5
          maxLength: 2000
          description: Le coordinate del documento correlato allo stato. 
        sha256:
          type: string 
          minLength: 40
          maxLength: 50
          description: >-
            sha256, codificato in base 64, del contenuto del file riferenziato dal campo uri
        error:
          type: string
          description: >-
            identificativo dell'errore
            - _E01_ //FIXME elencare i casi
            - _E02_